<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>台股當沖決策輔助系統 — 族群雷達</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="page">
  <header class="top">
    <h1>台股當沖決策輔助系統 <span class="badge-phase">Phase 0 · MVP</span></h1>
    <nav class="tabs">
      <a href="index.html">盤勢總覽</a>
      <a href="sectors.html" class="active">族群雷達</a>
    </nav>
  </header>

  <div class="meta-line" id="meta-line">資料載入中…</div>
  <div class="meta-line">點卡片可展開看族群內個股明細。分類依「上漲家數比例＋站上VWAP比例」計算，門檻可調整（見 config/thresholds.json）。</div>

  <div id="content">
    <div class="loading">載入中…</div>
  </div>

  <footer class="page-footer">
    族群成分股目前是每族群 3-6 檔種子代表股（見
    <a href="https://github.com/lemon10712-coder/tw-daytrading-engine/blob/master/config/sectors.json" target="_blank" rel="noopener">config/sectors.json</a>），
    尚未涵蓋族群全部成分股；部分族群代號尚待人工複查（標註 verified:false）。
  </footer>
</div>

<script src="assets/app.js"></script>
<script>
const SYNC_ORDER = ['強同步偏多', '弱同步偏多', '中性分化', '弱同步偏空', '強同步偏空', '資料不足'];

async function main() {
  const contentEl = document.getElementById('content');
  const metaEl = document.getElementById('meta-line');

  let data;
  try {
    data = await fetchJson('data/sector-radar/latest.json');
  } catch (err) {
    contentEl.innerHTML = `<div class="error-box">讀取族群資料失敗：${escapeHtml(err.message)}</div>`;
    return;
  }

  const entry = data.entry;
  metaEl.textContent = `資料時間：${entry.generated_at_taipei}（台北時間）`;

  const sorted = [...entry.sectors].sort((a, b) => SYNC_ORDER.indexOf(a.classification) - SYNC_ORDER.indexOf(b.classification));

  contentEl.innerHTML = `<div class="sector-grid">${sorted.map(renderSectorCard).join('')}</div>`;

  contentEl.querySelectorAll('.sector-card').forEach((card) => {
    card.addEventListener('click', () => card.classList.toggle('expanded'));
  });
}

function renderSectorCard(sector) {
  const summary = sector.totalCount > 0
    ? `${sector.upCount}/${sector.totalCount} 檔上漲　平均 ${formatPct(sector.avgReturn)}`
    : sector.reason;
  const rows = sector.stocks.map((s) => `
    <tr>
      <td>${escapeHtml(s.code)}</td>
      <td>${escapeHtml(s.name)}</td>
      <td>${formatPrice(s.price)}</td>
      <td class="pct ${pctClass(s.pctChange)}">${formatPct(s.pctChange)}</td>
      <td>${s.vwap != null ? formatPrice(s.vwap) : '—'}</td>
      <td>${s.aboveVwap === true ? '站上' : s.aboveVwap === false ? '跌破' : '—'}</td>
    </tr>
  `).join('');

  return `
    <div class="sector-card">
      <div class="head">
        <div class="name">${escapeHtml(sector.name)}</div>
        <div class="sync-badge sync-${sector.classification}">${sector.classification}</div>
      </div>
      <div class="summary">${escapeHtml(summary)}</div>
      <table class="stock-table">
        <thead><tr><th>代號</th><th>名稱</th><th>價格</th><th>漲跌</th><th>VWAP</th><th>相對VWAP</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}
main();
</script>
</body>
</html>
